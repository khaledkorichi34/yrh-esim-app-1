name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Generate the Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk YRH-eSIM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YRH-eSIM-apk
          path: YRH-eSIM.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YRH eSIM build ${{ github.run_number }}
          body: Install YRH-eSIM.apk on an Android phone (allow installs from your browser when asked). Test build, not for Google Play.
          files: YRH-eSIM.apk
