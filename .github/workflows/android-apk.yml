name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'marketing/**'
      - '.github/workflows/pinterest-daily.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          set -o pipefail
          { npm install && npx expo install --fix; } 2>&1 | tee build.log

      - name: Generate the Android project
        run: npx expo prebuild --platform android --non-interactive 2>&1 | tee -a build.log

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../build.log

      - name: Save the build log if the build fails
        if: failure()
        run: |
          { grep -n -B5 -A60 "What went wrong" build.log || true; echo "=========== LAST 300 LINES ==========="; tail -n 300 build.log; } > /tmp/build-tail.log
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan build-logs
          git rm -rfq --cached .
          cp /tmp/build-tail.log build-tail.log
          git add -f build-tail.log
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk YRH-eSIM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YRH-eSIM-apk
          path: YRH-eSIM.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YRH eSIM build ${{ github.run_number }}
          body: Install YRH-eSIM.apk on an Android phone (allow installs from your browser when asked). Test build, not for Google Play.
          files: YRH-eSIM.apk
